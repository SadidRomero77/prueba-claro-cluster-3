# Databricks Apps · app de sustentación (Streamlit + sistema multiagente + copiloto)
# Los artefactos los produce el job `cluster3_pipeline` en el Volume indicado en CLUSTER3_VOLUME.
# Las claves no van aquí: llegan como recursos de secreto declarados en databricks.yml (valueFrom).
command:
  - streamlit
  - run
  - src/cluster3/app/streamlit_app.py
  - --server.headless=true

env:
  - name: CLUSTER3_VOLUME
    value: /Volumes/workspace/cluster3/artefactos
  - name: CLUSTER3_ROOT
    value: /tmp/cluster3
  # Mismo proveedor que en local: OpenRouter (modelo elegible en la app) + Jev
  - name: LLM_PROVIDER
    value: openrouter
  - name: OPENROUTER_API_KEY
    valueFrom: openrouter-key
  - name: TYPESAFE_API_KEY
    valueFrom: typesafe-key
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
